services:
  - type: web
    name: aurelia-jewellery
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn aurelia_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
