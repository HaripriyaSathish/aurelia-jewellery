services:
  - type: web
    name: vetri-jewellery
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn vetri_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: FRONTEND_URL
        value: "https://vetri-jewellery.onrender.com"
      # Cashfree TEST-mode credentials — set these in the Render dashboard
      # (Environment tab) after creating a free test account at
      # https://merchant.cashfree.com/merchants/signup
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: "TEST"
      # Optional: enables open-ended AI answers in the chatbot widget.
      # Leave unset to keep the rule-based offers/order-tracking replies only.
      - key: GROQ_API_KEY
        sync: false
      - key: GST_RATE
        value: "0.03"
      - key: GSTIN
        sync: false
      # Optional: enables automated WhatsApp order-status messages.
      # Requires a Meta Business + WhatsApp API setup — see backend/.env.example.
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
